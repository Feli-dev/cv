name: Build CV

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4

      - name: Compile PDFs
        run: |
          typst compile cv.typ
          typst compile cv-en.typ

      - uses: actions/upload-artifact@v4
        with:
          name: cv
          path: |
            cv.pdf
            cv-en.pdf
